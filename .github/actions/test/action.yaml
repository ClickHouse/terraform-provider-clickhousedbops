name: "Run test"
description: "Runs an e2e test"
inputs:
  example:
    required: true
    description: "The example to run"
  clickhouse_version:
    required: true
    description: "The clickhouse version to use"
  terraform_image:
    required: true
    description: "The terraform/tofu docker image to use"
  terraform_version:
    required: true
    description: "The terraform/tofu docker image version to use"
  terraform_binary:
    required: true
    description: "Name of the binary to call"
  protocol:
    required: true
    description: "The protocol to use to connect to clickhouse"
  cluster_type:
    required: true
    description: "Name of the clickhouse cluster or 'null'"
  upgrade_test:
    required: false
    default: "true"
    description: "Whether to check that upgrading from the latest release plans no changes"

runs:
  using: "composite"
  steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: terraform-provider-clickhousedbops
        path: .

    - shell: bash
      run: |
        chmod +x ./terraform-provider-clickhousedbops
        ls -lah

    - shell: bash
      run: |
        chmod +x .github/actions/test/prepare.sh
        .github/actions/test/prepare.sh --example="${{ inputs.example }}" --clickhouse-version="${{inputs.clickhouse_version}}" --terraform-version="${{inputs.terraform_version}}" --terraform-image="${{inputs.terraform_image}}" --protocol="${{inputs.protocol}}" --cluster-type="${{inputs.cluster_type}}"

    - name: Run e2e test
      shell: bash
      run: |
        cd tests/
        docker compose exec shell ash -c "cd ${{ inputs.example }} && ${{ inputs.terraform_binary }} apply -auto-approve && ${{ inputs.terraform_binary }} destroy -auto-approve"

    - name: Run upgrade test
      if: inputs.upgrade_test != 'false'
      shell: bash
      env:
        REGISTRY: ${{ inputs.terraform_binary == 'tofu' && 'registry.opentofu.org' || 'registry.terraform.io' }}
      run: |
        version="$(curl -sf "https://${REGISTRY}/v1/providers/ClickHouse/clickhousedbops/versions" | jq -r '.versions[].version' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)"
        git fetch origin tag "v${version}"
        git cat-file -e "v${version}:examples/tests/${{ inputs.example }}" 2>/dev/null || { echo "${{ inputs.example }} is not in v${version}, skipping"; exit 0; }
        cd tests/
        git -C .. archive --prefix="${{ inputs.example }}/" "v${version}:examples/tests/${{ inputs.example }}" | docker compose exec -T shell tar -x -C /tmp
        # Empty CLI config skips dev_overrides, so the state is created by the released provider.
        docker compose exec -e TF_CLI_CONFIG_FILE=/dev/null shell ash -c "cd /tmp/${{ inputs.example }} && sed -i '/version *=/d' provider.tf && ${{ inputs.terraform_binary }} init && ${{ inputs.terraform_binary }} apply -auto-approve"
        docker compose exec shell ash -c "cd /tmp/${{ inputs.example }} && ${{ inputs.terraform_binary }} plan -detailed-exitcode && ${{ inputs.terraform_binary }} destroy -auto-approve"

    - name: Stop test env
      if: always()
      shell: bash
      run: |
        cd tests/
        docker compose kill
        docker compose rm -f
